# Standalone NAS deployment.
services:
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: ktv-db
    environment:
      POSTGRES_DB: ktv-db
      POSTGRES_USER: toretto
      POSTGRES_PASSWORD: zl19960914.
      TZ: Asia/Shanghai
    command: ["-c", "listen_addresses=*", "-c", "port=5433"]
    ports:
      - "5433:5433"
    volumes:
      - /volume2/docker/ktv_home_lib/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toretto -d ktv -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m

  ktv:
    image: toretto5060/ktv-home:latest
    container_name: ktv-app
    devices:
      - /dev/dri:/dev/dri
    # Allow the JVM process to access /dev/dri/renderD* via the render group
    # (GID 937 on Synology DSM). The backend also tries to auto-recover at
    # startup if the kernel still rejects root access.
    group_add:
      - "937"
      - "44"
      - "109"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5433/ktv-db
      SPRING_DATASOURCE_USERNAME: toretto
      SPRING_DATASOURCE_PASSWORD: zl19960914.
      KTV_SOURCE_LIBRARY_PATH: /source-music
      KTV_LIBRARY_PATH: /music
      KTV_DATA_PATH: /data
      KTV_DISCOVERY_ENABLED: "true"
      KTV_DISCOVERY_UDP_PORT: 18888
      KTV_DISCOVERY_NAME: 唱吧
      KTV_AI_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "8083:8083/tcp"
      - "18888:18888/udp"
    volumes:
      - /volume1/music/mv:/source-music
      - /volume1/music/ktv_mv:/music
      - /volume2/docker/ktv_home_lib/data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
